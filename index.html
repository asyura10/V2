<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buku Kas Taruna</title>
<style>
:root{--bg:#f3f1ea;--card:#fff;--ink:#14213d;--mut:#667085;--navy:#0f2547;--gold:#b8892b;--line:#e1ddd0;--in:#18794e;--out:#b42318;--r:10px}
:root[data-theme=dark]{--bg:#0b1627;--card:#12233d;--ink:#eef1f6;--mut:#9aa8bf;--navy:#08111f;--gold:#e0b04a;--line:#24385a;--in:#4ade80;--out:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Georgia,'Times New Roman',serif}
button,input,select{font:inherit;color:inherit}
header{background:var(--navy);color:#fff;padding:18px 16px 0;border-bottom:4px solid var(--gold)}
.wrap{max-width:980px;margin:0 auto}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
h1{margin:0;font-size:22px;letter-spacing:.3px}
h1 small{display:block;font-size:13px;font-weight:400;color:#c9d3e6}
.ctl{display:flex;gap:8px;align-items:center}
.ctl input,.ctl button{background:#1b335c;border:1px solid #34507f;color:#fff;border-radius:8px;padding:6px 10px}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:14px}
nav button{background:none;border:0;color:#c9d3e6;padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:#fff;border-color:var(--gold);font-weight:700}
main{padding:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card h3{margin:0 0 8px;font-size:15px}
.big{font-size:24px;font-weight:700;margin:2px 0}
.mut{color:var(--mut);font-size:13px}
.in{color:var(--in)}.out{color:var(--out)}
.sec{margin-top:16px}
form.f{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.f label{display:grid;gap:3px;font-size:13px;color:var(--mut)}
.f input,.f select,.srch{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--ink);width:100%}
.btn{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer}
:root[data-theme=dark] .btn{background:var(--gold);color:#08111f}
.btn.s{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.d{background:none;color:var(--out);border:1px solid var(--out)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border:0}
.row .l{min-width:0}.row .l b{display:block;overflow:hidden;text-overflow:ellipsis}
.acts button{background:none;border:0;cursor:pointer;color:var(--mut);padding:2px 6px}
.bar{height:9px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--gold)}
.bar i.over{background:var(--out)}
.tr{display:flex;align-items:flex-end;gap:10px;height:130px;margin-top:8px}
.tr div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.tr span{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.tr em{width:42%;max-width:22px;border-radius:3px 3px 0 0;display:block}
.tr small{font-size:11px;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:18px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:20px;opacity:0;transition:.25s;pointer-events:none;border:1px solid var(--gold)}
#toast.on{opacity:1}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.pill{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:12px;padding:0 8px;color:var(--mut)}
</style>
</head>
<body>
<header><div class="wrap">
<div class="top">
<h1>Buku Kas Taruna<small id="sub"></small></h1>
<div class="ctl"><input type="month" id="mon" aria-label="Pilih bulan"><button id="thm" title="Ganti tema" aria-label="Ganti tema">Tema</button></div>
</div>
<nav id="nav"></nav>
</div></header>
<main class="wrap" id="app"></main>
<div id="toast" role="status"></div>
<script>
const K='buku_kas_taruna_v1';
const CI=['Uang saku','Kiriman keluarga','Beasiswa / tunjangan','Usaha','Saldo awal','Lainnya'];
const CO=['Makan','Transportasi','Kebutuhan asrama','Pendidikan','Pulsa / internet','Kesehatan','Hiburan','Kiriman ke keluarga','Tabungan','Lainnya'];
const TABS=[['ring','Ringkasan'],['trx','Transaksi'],['ang','Anggaran'],['tab','Tabungan'],['set','Pengaturan']];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(n<0?'-':'')+'Rp '+Math.round(Math.abs(n)).toLocaleString('id-ID');
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let S=load(),tab='ring',month=today().slice(0,7),editId=null,q='',ftype='';
function load(){try{const d=JSON.parse(localStorage.getItem(K));if(d&&Array.isArray(d.tx))return Object.assign({wallets:['Tunai','Rekening','E-Wallet'],budgets:{},goals:[],name:'',theme:''},d)}catch(e){}
return{tx:[],wallets:['Tunai','Rekening','E-Wallet'],budgets:{},goals:[],name:'',theme:''}}
function save(){try{localStorage.setItem(K,JSON.stringify(S));return true}catch(e){toast('Gagal menyimpan. Penyimpanan browser penuh atau diblokir.');return false}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200)}
const sum=(a,t)=>a.filter(x=>x.type===t).reduce((s,x)=>s+x.amt,0);
const mtx=()=>S.tx.filter(t=>t.d.startsWith(month));
const shift=(m,n)=>{const[y,mm]=m.split('-').map(Number);const d=new Date(y,mm-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const mname=m=>new Date(m+'-01T00:00').toLocaleDateString('id-ID',{month:'short'});
const bal=w=>S.tx.filter(t=>t.w===w).reduce((s,t)=>s+(t.type==='in'?t.amt:-t.amt),0);
function applyTheme(){const t=S.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}
function head(){$('#sub').textContent=S.name?('Taruna '+S.name):'Catatan keuangan pribadi';$('#mon').value=month;
$('#nav').innerHTML=TABS.map(([k,v])=>`<button data-a="tab" data-k="${k}" class="${tab===k?'on':''}">${v}</button>`).join('')}
function render(){head();$('#app').innerHTML={ring:vRing,trx:vTrx,ang:vAng,tab:vTab,set:vSet}[tab]();if(tab==='trx')list()}

function vRing(){const m=mtx(),i=sum(m,'in'),o=sum(m,'out'),tot=sum(S.tx,'in')-sum(S.tx,'out');
const cats={};m.filter(t=>t.type==='out').forEach(t=>cats[t.c]=(cats[t.c]||0)+t.amt);
const ce=Object.entries(cats).sort((a,b)=>b[1]-a[1]),mx=ce[0]?ce[0][1]:1;
const months=[5,4,3,2,1,0].map(n=>shift(month,-n)).map(k=>{const a=S.tx.filter(t=>t.d.startsWith(k));return{k,i:sum(a,'in'),o:sum(a,'out')}});
const tm=Math.max(1,...months.map(x=>Math.max(x.i,x.o)));
return`<div class="grid">
<div class="card"><div class="mut">Total saldo semua dompet</div><div class="big">${fmt(tot)}</div></div>
<div class="card"><div class="mut">Pemasukan bulan ini</div><div class="big in">${fmt(i)}</div></div>
<div class="card"><div class="mut">Pengeluaran bulan ini</div><div class="big out">${fmt(o)}</div></div>
<div class="card"><div class="mut">Sisa bulan ini</div><div class="big ${i-o<0?'out':''}">${fmt(i-o)}</div><div class="mut">${i?Math.round((i-o)/i*100)+'% dari pemasukan ditabung':'Belum ada pemasukan'}</div></div></div>
<div class="grid sec">
<div class="card"><h3>Saldo per dompet</h3>${S.wallets.map(w=>`<div class="row"><span>${esc(w)}</span><b class="${bal(w)<0?'out':''}">${fmt(bal(w))}</b></div>`).join('')||'<div class="empty">Belum ada dompet</div>'}</div>
<div class="card"><h3>Pengeluaran per kategori</h3>${ce.length?ce.map(([c,v])=>`<div style="margin-bottom:8px"><div class="row" style="border:0;padding:0"><span>${esc(c)}</span><b>${fmt(v)}</b></div><div class="bar"><i style="width:${v/mx*100}%"></i></div></div>`).join(''):'<div class="empty">Belum ada pengeluaran bulan ini</div>'}</div></div>
<div class="card sec"><h3>Tren 6 bulan <span class="pill" style="border-color:var(--in);color:var(--in)">masuk</span> <span class="pill" style="border-color:var(--out);color:var(--out)">keluar</span></h3>
<div class="tr">${months.map(x=>`<div><span><em title="${fmt(x.i)}" style="background:var(--in);height:${x.i/tm*100}%"></em><em title="${fmt(x.o)}" style="background:var(--out);height:${x.o/tm*100}%"></em></span><small>${mname(x.k)}</small></div>`).join('')}</div></div>`}

function opts(a,v){return a.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')}
function vTrx(){const e=S.tx.find(t=>t.id===editId)||{type:'out',d:today(),c:CO[0],w:S.wallets[0],amt:'',n:''};
return`<div class="card"><h3>${editId?'Ubah transaksi':'Tambah transaksi'}</h3>
<form class="f" id="fx">
<label>Jenis<select name="type" id="ty"><option value="out"${e.type==='out'?' selected':''}>Pengeluaran</option><option value="in"${e.type==='in'?' selected':''}>Pemasukan</option></select></label>
<label>Tanggal<input type="date" name="d" value="${e.d}" required></label>
<label>Kategori<select name="c" id="cat">${opts(e.type==='in'?CI:CO,e.c)}</select></label>
<label>Dompet<select name="w">${opts(S.wallets,e.w)}</select></label>
<label>Nominal (Rp)<input type="number" name="amt" min="1" step="1" inputmode="numeric" value="${e.amt}" required></label>
<label>Catatan<input name="n" maxlength="120" value="${esc(e.n)}" placeholder="Opsional"></label>
<label>&nbsp;<span><button class="btn" type="submit">${editId?'Simpan perubahan':'Tambah'}</button>${editId?' <button class="btn s" type="button" data-a="cancel">Batal</button>':''}</span></label>
</form></div>
<div class="card sec"><div class="grid" style="margin-bottom:8px"><input class="srch" id="q" placeholder="Cari catatan atau kategori" value="${esc(q)}"><select class="srch" id="ft"><option value="">Semua jenis</option><option value="in"${ftype==='in'?' selected':''}>Pemasukan</option><option value="out"${ftype==='out'?' selected':''}>Pengeluaran</option></select></div><div id="list"></div></div>`}
function list(){const k=q.toLowerCase();const a=mtx().filter(t=>(!ftype||t.type===ftype)&&(!k||(t.n+t.c+t.w).toLowerCase().includes(k))).sort((x,y)=>y.d.localeCompare(x.d)||y.id.localeCompare(x.id));
$('#list').innerHTML=a.length?a.map(t=>`<div class="row"><div class="l"><b>${esc(t.c)}${t.n?' <span class="mut">- '+esc(t.n)+'</span>':''}</b><span class="mut">${t.d.split('-').reverse().join('/')} <span class="pill">${esc(t.w)}</span></span></div><div style="text-align:right"><b class="${t.type==='in'?'in':'out'}">${t.type==='in'?'+':'-'}${fmt(t.amt)}</b><div class="acts"><button data-a="edit" data-k="${t.id}">Ubah</button><button data-a="del" data-k="${t.id}">Hapus</button></div></div></div>`).join(''):'<div class="empty">Belum ada transaksi di bulan ini. Isi formulir di atas untuk mencatat yang pertama.</div>'}

function vAng(){const sp={};mtx().filter(t=>t.type==='out').forEach(t=>sp[t.c]=(sp[t.c]||0)+t.amt);
return`<div class="card"><h3>Batas anggaran bulanan</h3><p class="mut">Isi batas per kategori. Kosongkan atau isi 0 untuk menghapus batas.</p>
${CO.map(c=>{const b=S.budgets[c]||0,s=sp[c]||0,p=b?s/b*100:0;return`<div style="margin-bottom:12px"><div class="row" style="border:0;padding:0;gap:8px"><span>${c}</span><input type="number" min="0" class="srch" style="max-width:150px" data-a="bud" data-k="${esc(c)}" value="${b||''}" placeholder="Batas Rp"></div>
${b?`<div class="bar"><i class="${p>100?'over':''}" style="width:${Math.min(p,100)}%"></i></div><div class="mut ${p>100?'out':''}">${fmt(s)} dari ${fmt(b)} (${Math.round(p)}%)${p>100?' - melebihi batas '+fmt(s-b):''}</div>`:`<div class="mut">Terpakai ${fmt(s)}</div>`}</div>`}).join('')}</div>`}

function vTab(){return`<div class="card"><h3>Tambah target tabungan</h3><form class="f" id="fg"><label>Nama target<input name="n" required maxlength="60" placeholder="Misal: laptop, mudik"></label><label>Target (Rp)<input type="number" name="t" min="1" required></label><label>&nbsp;<button class="btn" type="submit">Tambah target</button></label></form></div>
<div class="grid sec">${S.goals.map(g=>{const p=Math.min(100,g.s/g.t*100);return`<div class="card"><h3>${esc(g.n)}</h3><div class="big">${fmt(g.s)}</div><div class="mut">dari ${fmt(g.t)} (${Math.round(p)}%)</div><div class="bar"><i style="width:${p}%"></i></div><div style="margin-top:10px;display:flex;gap:6px"><button class="btn" data-a="gadd" data-k="${g.id}">Setor</button><button class="btn s" data-a="gout" data-k="${g.id}">Tarik</button><button class="btn d" data-a="gdel" data-k="${g.id}">Hapus</button></div></div>`}).join('')||'<div class="card empty" style="grid-column:1/-1">Belum ada target. Buat satu di atas.</div>'}</div>
<p class="mut">Catatan: saldo target tabungan dicatat terpisah dan tidak otomatis mengubah saldo dompet. Catat juga di Transaksi bila uangnya keluar dari dompet.</p>`}

function vSet(){return`<div class="grid">
<div class="card"><h3>Profil</h3><label class="mut">Nama panggilan<input class="srch" data-a="name" value="${esc(S.name)}" maxlength="40"></label></div>
<div class="card"><h3>Dompet</h3>${S.wallets.map(w=>`<div class="row"><span>${esc(w)}</span><button class="btn d" data-a="wdel" data-k="${esc(w)}">Hapus</button></div>`).join('')}<form class="f" id="fw" style="margin-top:8px"><input class="srch" name="n" placeholder="Nama dompet baru" required maxlength="30"><button class="btn" type="submit">Tambah</button></form></div>
<div class="card"><h3>Cadangan data</h3><p class="mut">Data tersimpan di browser perangkat ini. Unduh cadangan secara rutin.</p><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" data-a="exj">Unduh cadangan (JSON)</button><button class="btn s" data-a="exc">Ekspor CSV</button><button class="btn s" data-a="imp">Pulihkan dari JSON</button></div><input type="file" id="fi" accept=".json,application/json" hidden></div>
<div class="card"><h3>Hapus semua data</h3><p class="mut">Tidak bisa dibatalkan. Unduh cadangan dulu.</p><button class="btn d" data-a="reset">Hapus semua</button></div></div>`}

function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b||b.tagName==='INPUT')return;const a=b.dataset.a,k=b.dataset.k;
if(a==='tab'){tab=k;editId=null;render()}
else if(a==='edit'){editId=k;render();scrollTo({top:0,behavior:'smooth'})}
else if(a==='cancel'){editId=null;render()}
else if(a==='del'){if(confirm('Hapus transaksi ini?')){S.tx=S.tx.filter(t=>t.id!==k);save();render();toast('Transaksi dihapus')}}
else if(a==='gadd'||a==='gout'){const g=S.goals.find(x=>x.id===k),v=Number(prompt(a==='gadd'?'Jumlah setoran (Rp):':'Jumlah penarikan (Rp):'));if(v>0){g.s=Math.max(0,g.s+(a==='gadd'?v:-v));save();render()}}
else if(a==='gdel'){if(confirm('Hapus target ini?')){S.goals=S.goals.filter(x=>x.id!==k);save();render()}}
else if(a==='wdel'){if(S.tx.some(t=>t.w===k))toast('Dompet masih dipakai transaksi. Ubah atau hapus transaksinya dulu.');else if(S.wallets.length<2)toast('Minimal ada satu dompet');else{S.wallets=S.wallets.filter(w=>w!==k);save();render()}}
else if(a==='exj')dl('buku-kas-cadangan-'+today()+'.json',JSON.stringify(S,null,2),'application/json');
else if(a==='exc'){const r=[['Tanggal','Jenis','Kategori','Dompet','Nominal','Catatan'],...S.tx.slice().sort((x,y)=>x.d.localeCompare(y.d)).map(t=>[t.d,t.type==='in'?'Pemasukan':'Pengeluaran',t.c,t.w,t.amt,t.n])];dl('buku-kas-'+today()+'.csv','\ufeff'+r.map(x=>x.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}
else if(a==='imp')$('#fi').click();
else if(a==='reset'){if(confirm('Hapus SEMUA data? Tidak bisa dibatalkan.')&&confirm('Yakin? Pastikan sudah punya cadangan.')){const th=S.theme;S={tx:[],wallets:['Tunai','Rekening','E-Wallet'],budgets:{},goals:[],name:'',theme:th};save();render();toast('Semua data dihapus')}}});
document.addEventListener('change',ev=>{const t=ev.target;
if(t.id==='mon'){if(t.value){month=t.value;render()}}
else if(t.id==='ty'){$('#cat').innerHTML=opts(t.value==='in'?CI:CO)}
else if(t.id==='ft'){ftype=t.value;list()}
else if(t.id==='fi'){const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.tx))throw 0;if(!d.tx.every(x=>x&&typeof x.amt==='number'&&typeof x.d==='string'&&(x.type==='in'||x.type==='out')))throw 0;if(!confirm('Data saat ini akan diganti isi cadangan ('+d.tx.length+' transaksi). Lanjut?'))return;S=Object.assign({wallets:['Tunai'],budgets:{},goals:[],name:'',theme:S.theme},d);S.tx.forEach(x=>{x.id=x.id||uid();x.c=x.c||'Lainnya';x.w=x.w||S.wallets[0];x.n=x.n||''});save();render();toast('Data dipulihkan')}catch(e){toast('Berkas cadangan tidak valid')}t.value=''};r.readAsText(f)}
else if(t.dataset.a==='bud'){const v=Number(t.value);if(v>0)S.budgets[t.dataset.k]=v;else delete S.budgets[t.dataset.k];save();render();toast('Anggaran disimpan')}
else if(t.dataset.a==='name'){S.name=t.value.trim();save();head()}});
document.addEventListener('input',ev=>{if(ev.target.id==='q'){q=ev.target.value;list()}});
document.addEventListener('submit',ev=>{ev.preventDefault();const f=ev.target,d=Object.fromEntries(new FormData(f));
if(f.id==='fx'){const amt=Math.round(Number(d.amt));if(!(amt>0))return toast('Nominal harus lebih dari 0');const o={type:d.type,d:d.d,c:d.c,w:d.w,amt,n:d.n.trim()};
if(editId){Object.assign(S.tx.find(t=>t.id===editId),o);editId=null}else S.tx.push({id:uid(),...o});
if(save()){month=o.d.slice(0,7);toast('Transaksi disimpan');render()}}
else if(f.id==='fg'){S.goals.push({id:uid(),n:d.n.trim(),t:Number(d.t),s:0});save();render()}
else if(f.id==='fw'){const n=d.n.trim();if(S.wallets.includes(n))return toast('Nama dompet sudah ada');S.wallets.push(n);save();render()}});
$('#thm').onclick=()=>{S.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';save();applyTheme()};
applyTheme();render();
</script>
</body>
</html>
